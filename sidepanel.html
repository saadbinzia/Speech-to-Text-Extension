<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Meet Transcription</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      color: #202124;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
    }

    .brand {
      font-size: 28px;
      font-weight: 800;
      color: #5b4bff;
    }

    .settings {
      color: #5f6368;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .settings svg { width: 20px; height: 20px; }

    .card {
      margin: 0 16px 12px 16px;
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #e0e3e7;
      padding: 14px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }

    .meeting-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #202124;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #5f6368;
    }

    .dot { width: 10px; height: 10px; border-radius: 50%; background: #c2c5cc; }
    .dot.active { background: #ea4335; }

    .user-row { margin-top: 12px; font-size: 13px; color: #5f6368; }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 8px 16px 12px 16px;
    }

    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 600;
      min-width: 150px;
    }

    .btn-start { background: #34a853; color: white; }
    .btn-start:hover { background: #2d8f47; }
    .btn-stop { background: #ea4335; color: white; }
    .btn-stop:hover { background: #d33b2c; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .status {
      padding: 10px 16px;
      background: #ffffff;
      border-top: 1px solid #e0e3e7;
      border-bottom: 1px solid #e0e3e7;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-indicator { width: 8px; height: 8px; border-radius: 50%; background: #ea4335; }
    .status-indicator.recording { background: #34a853; animation: pulse 2s infinite; }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

    .transcription-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: #ffffff;
    }

    .transcript-item {
      margin-bottom: 16px;
      padding: 12px;
      background: #f5f7fa;
      border-radius: 8px;
      border-left: 3px solid #5b4bff;
      animation: fadeIn 0.3s ease;
      color: #202124;
    }

    .transcript-item.partial { background: #eef2ff; border-left-color: #8a86ff; opacity: 0.95; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .transcript-text { font-size: 14px; line-height: 1.45; margin-bottom: 8px; }

    .transcript-meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #5f6368; }

    .confidence { background: #eef2ff; padding: 2px 6px; border-radius: 10px; font-size: 11px; font-weight: 500; color: #3c40a0; }

    .timestamp { font-size: 11px; color: #9aa0a6; }

    .no-transcripts { text-align: center; color: #5f6368; font-style: italic; margin-top: 30px; }

    .warning { background: #fff3cd; border: 1px solid #ffeaa7; color: #856404; padding: 12px 16px; font-size: 13px; text-align: center; display: none; margin: 8px 16px; border-radius: 8px; }
    .warning.show { display: block; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">Swiftly</div>
    <div class="settings" id="settingsBtn" title="Settings">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14,12.94a7.43,7.43,0,0,0,.05-1l2-1.55a.5.5,0,0,0,.12-.64l-1.9-3.29a.5.5,0,0,0-.6-.22l-2.35,1a7.49,7.49,0,0,0-1.73-1l-.36-2.49A.5.5,0,0,0,12.87,2H11.13a.5.5,0,0,0-.5.43L10.27,5a7.49,7.49,0,0,0-1.73,1l-2.35-1a.5.5,0,0,0-.6.22L3.69,8.5a.5.5,0,0,0,.12.64l2,1.55a7.43,7.43,0,0,0,0,2l-2,1.55a.5.5,0,0,0-.12.64l1.9,3.29a.5.5,0,0,0,.6.22l2.35-1a7.49,7.49,0,0,0,1.73,1l.36,2.49a.5.5,0,0,0,.5.43h1.74a.5.5,0,0,0,.5-.43l.36-2.49a7.49,7.49,0,0,0,1.73-1l2.35,1a.5.5,0,0,0,.6-.22l1.9-3.29a.5.5,0,0,0-.12-.64ZM12,15.5A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z"/></svg>
    </div>
  </div>

  <div class="card" id="meetingCard">
    <div class="meeting-title" id="meetingTitle">Meeting Transcription</div>
    <div class="status-row" id="meetingStatus"><span class="dot" id="meetingDot"></span><span>No active recording</span></div>
    <div class="user-row" id="userInfo">Robert Fox<br/>RobertFox@gmail.com</div>
  </div>

  <div class="controls">
    <button class="btn btn-start" id="startBtn">Start Recording</button>
    <button class="btn btn-stop" id="stopBtn" disabled>Stop Recording</button>
  </div>

  <div class="warning" id="warning">Please navigate to a Google Meet page to start transcription</div>

  <div class="status" id="status">
    <div class="status-indicator" id="statusIndicator"></div>
    <span id="statusText">Ready to record</span>
  </div>

  <div class="transcription-container" id="transcriptionContainer">
    <div class="no-transcripts" id="noTranscripts">Click "Start Recording" to begin live transcription of your Google Meet</div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
