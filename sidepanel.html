<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 400px;
      height: 100vh;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f8f9fa;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: #1a73e8;
      color: white;
      padding: 12px;
      text-align: center;
      font-weight: bold;
      font-size: 15px;
      flex-shrink: 0;
    }
    .controls { 
      padding: 12px; 
      background: white; 
      border-bottom: 1px solid #e0e0e0; 
      flex-shrink: 0;
    }
    .btn { 
      width: 100%; 
      padding: 10px; 
      border: none; 
      border-radius: 6px; 
      font-size: 14px; 
      cursor: pointer; 
      margin-bottom: 8px;
    }
    .start { background: #34a853; color: white; }
    .stop { background: #ea4335; color: white; display: none; }
    .status { 
      text-align: center; 
      margin: 10px 0; 
      font-size: 12px; 
      color: #666;
      padding: 8px;
      background: #f5f5f5;
      border-radius: 4px;
    }
    .logs { 
      flex: 1;
      padding: 12px; 
      overflow-y: auto; 
      background: white;
      font-size: 12px;
      line-height: 1.4;
    }
    .log-entry {
      margin-bottom: 6px;
      padding: 6px 8px;
      border-radius: 4px;
      border-left: 3px solid #ddd;
    }
    .voice-detected {
      background-color: #e8f5e8;
      border-left-color: #4caf50;
    }
    .active-speaker {
      background-color: #e3f2fd;
      border-left-color: #2196f3;
    }
    .participants {
      background-color: #fff3e0;
      border-left-color: #ff9800;
    }
    .info {
      background-color: #f5f5f5;
      border-left-color: #666;
    }
  </style>
</head>
<body>
  <div class="header">Meet Voice Monitor</div>
  <div class="controls">
    <button id="startBtn" class="btn start">Start Monitoring</button>
    <button id="stopBtn" class="btn stop">Stop Monitoring</button>
    <div id="status" class="status">Ready. Click Start to begin monitoring.</div>
  </div>
  <div id="logs" class="logs"></div>
  <script src="sidepanel.js"></script>
</body>
</html>
